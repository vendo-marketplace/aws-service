server:
  url: server_test_url

spring:
  kafka:
    bootstrap-servers: test

security:
  jwt:
    internal:
      key: internalKeyinternalKeyinternalKeyinternalKey
    secret:
      key: secretKeysecretKeysecretKeysecretKeysecretKey

eureka:
  client:
    enabled: false

aws:
  access-key: accessKey
  secret-key: secretKey
  region: eu
  s3:
    bucket-name: bucketName
  presign:
    expiration: 600
  file:
    max-size: 8000000

kafka:
  events:
    product:
      image-requested-event:
        topic: "PRODUCT_IMAGE_REQUESTED_TOPIC"

endpoints:
  unauthenticated:
    general:
      - /actuator/health

