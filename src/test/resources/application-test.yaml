spring:
  kafka:
    bootstrap-servers: test

security:
  jwt:
    internal:
      key: internalKeyinternalKeyinternalKeyinternalKey

eureka:
  client:
    enabled: false

aws:
  access-key: accessKey
  secret-key: secretKey
  region: eu
  s3:
    bucket-name: bucketName
  presign:
    expiration: 600


endpoints:
  unauthenticated:
    general:
      - /actuator/health
    internal:
      - /internal/presign

kafka:
  events:
    file:
      deleted-event:
        topic: "FILE_TEST_DELETED_TOPIC"
        groupId: "file_test_deleted_group"
        container-factory: "consumerContainerFactory"
        properties:
          auto-offset-reset: "latest"

